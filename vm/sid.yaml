# Ubuntu 24.04 x86_64 VM for sid (real kernel: fanotify perm events + eBPF).
# On Apple Silicon this is full-system QEMU emulation: slower, but a genuine x86_64 guest.
arch: "x86_64"
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
cpus: 8
memory: "8GiB"
disk: "40GiB"
vmType: "qemu"
mounts:
  - location: "/Users/lucas/Projects/sid"
    mountPoint: "/workspace"
    writable: true
mountType: "9p"
containerd: {system: false, user: false}
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y build-essential clang llvm libbpf-dev libelf-dev zlib1g-dev \
        linux-tools-common linux-tools-generic bpftrace python3-pip python3-venv python3-bpfcc \
        bpfcc-tools libcap-dev strace nftables git jq tmux openssh-server
